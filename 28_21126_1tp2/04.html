<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Programowanie aplikacji webowych</title>
</head>
<body>
<h3>Java Script</h3>
<div id="par1"></div>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>

<script>
    const par1 = document.getElementById("par1");
    const par2 = document.getElementById("par2");
    const par3 = document.getElementById("par3");
    const par4 = document.getElementById("par4");

    const a = parseInt(prompt("Wpisz liczbę całkowitą"));
    const b = Math.round(Math.random() * 10 - 5);

    par1.innerHTML = `a = ${!isNaN(a) ? a : "nie jest liczbą"}<br>b = ${b} (wylosowana liczba)`;

    if(!isNaN(a) && a + b !== 0) {
        const result = (a**2 - 2*b)/(a +b);
        par2.innerHTML = `Wynik obliczeń: <b>${result.toFixed(2)}</b>`;
    } else {
        par2.innerHTML = "<b>Nie można wykonać działanie matematyczne</b>";
    }

</script>
</body>
</html>
