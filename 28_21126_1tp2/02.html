<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Programowanie aplikacji webowych</title>
</head>
<body>
<h3>Programowanie w JavaScript</h3>
<div id="par1"></div>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>

<script>
    const par1 = document.getElementById("par1");
    const par2 = document.getElementById("par2");
    const par3 = document.getElementById("par3");
    const par4 = document.getElementById("par4");

    const num1 = parseInt(prompt("Wpisz temperature"));
    let msg = "";

    if (!isNaN(num1)) {
        if (num1 > 20) {
            msg = "Załóż koszulkę";
        } else if(num1 >= 10) {
            msg = "Załóż kurtkę";
        } else {
            msg = "Ubierz się ciepło";
        }
    } else {
        msg = "Wprowadź poprawną wartość";
    }

    par1.innerHTML = msg;
</script>


</body>
</html>
