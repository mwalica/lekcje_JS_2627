<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programowanie aplikacji webowych</title>
</head>
<body>
<h3>prompt()</h3>
<div id="par1"></div>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>

<script>
  const par1 = document.getElementById("par1");
  const par2 = document.getElementById("par2");
  const par3 = document.getElementById("par3");
  const par4 = document.getElementById("par4");

  alert("Teraz pojawi sie pytanie");
  const city = prompt("W jakim mieście mieszkasz?");
  const country = prompt("W jakim kraju mieszkasz?", "wpisz nazwę państwa");
  const color= prompt("Wpisz kolor", "kolor w języku angielskim");
  console.log("Wpisane miasto: ", city);
  par1.innerHTML = "Moje miejsce zamieszkania to <strong style='color: red;'>" + city + "</strong>.";
  par2.innerHTML = `Moje państwo: <span style="color: ${color};">${country}</span>`;
  par3.innerHTML = 'Moje państwo: <span style="color: ' + color + '">' + country + '</span>';
</script>
</body>
</html>
