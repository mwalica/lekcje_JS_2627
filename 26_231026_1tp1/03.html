<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>JavaScript</title>
</head>
<body>
<h3>JavaScript</h3>
<div id="par1"></div>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>
<script>
  const par1 = document.getElementById('par1');
  const par2 = document.getElementById('par2');
  const par3 = document.getElementById('par3');
  const par4 = document.getElementById('par4');

  const numA = parseInt(prompt("Wprowadź liczbę"));
  const numB = Math.round(Math.random() * 10 - 5);

  let msg = null;

  if(!isNaN(numA) && (numA + numB !== 0)) {
    const result = (numA**2 - 2*numB) / (numA + numB);
    msg = `Wynik obliczeń: ${result.toFixed(2)}`;
  } else {
    msg = "Nie można wykonać działania matematycznego";
  }

  par1.innerHTML = `a = ${isNaN(numA) ? "nie jest liczbą" : numA} <br> b = ${numB} `;
  par2.innerHTML = msg;

</script>
</body>
</html>
