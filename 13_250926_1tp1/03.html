<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programowanie aplikacji webowych</title>
</head>
<body>
<h3>prompt i typ number</h3>
<div id="par1"></div>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>

<script>
  const par1 = document.getElementById("par1");
  const par2 = document.getElementById("par2");
  const par3 = document.getElementById("par3");
  const par4 = document.getElementById("par4");

  const numberA = parseFloat(prompt("Wpisz liczbę A"));
  const numberB = parseFloat(prompt("Wpisz liczbę B"));

  // const a = parseFloat(numberA);
  // const b = parseFloat(numberB);

  const result = 2*numberA + numberB**2;
  const result2 = numberA / numberB;

  par1.innerHTML = `a = ${numberA}, b = ${numberB}`;
  par2.innerHTML = `Wynik: ${result}`;
  par3.innerHTML = `Wynik: ${2*numberA + numberB**2}`;
  par4.innerHTML = `Wynik: ${result2.toFixed(3)}`;
</script>
</body>
</html>
