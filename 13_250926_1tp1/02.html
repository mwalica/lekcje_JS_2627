<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programowanie aplikacji webowych</title>
</head>
<body>
<h3>Programowanie w JavaScript - działania matematyczne</h3>
<div id="par1"></div>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>

<script>
  const par1 = document.getElementById("par1");
  const par2 = document.getElementById("par2");
  const par3 = document.getElementById("par3");
  const par4 = document.getElementById("par4");

  const numberA = 6;
  const numberB = "4";
  const numberC = 12.99;

  //parseInt zamiania na liczbe całkowitą
  //parseFloat zamiana na liczbę zmiennoprzecinkową
  const result1 = parseInt(numberA) + parseInt(numberB);//10
  const result2 = parseFloat(numberB) + parseFloat(numberC);//16.99

  const a = parseInt(numberA)
  const b = parseInt(numberB)

  par1.innerHTML = "numberA + numberB = " + result1;
  par2.innerHTML = "numberB + numberC = " + result2;
  par3.innerHTML = `
    <ul>
        <li>a = ${a}, b = ${b}</li>
        <li>a + b = ${a + b}</li>
        <li>a - b = ${a - b}</li>
        <li>a * b = ${a * b}</li>
        <li>a : b = ${a / b}</li>
        <li>a<sup>2</sup> = ${a ** 2}</li>
        <li>reszta z dzielenia a przez b = ${a % b}</li>
    </ul>
    `;


</script>
</body>
</html>
