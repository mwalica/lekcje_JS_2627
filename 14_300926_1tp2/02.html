<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programowanie aplikacji webowych</title>
</head>
<body>
<h3>Typ number(liczbowy) w JavaScript</h3>
<div id="par1"></div>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>

<script>
  const par1 = document.getElementById("par1");
  const par2 = document.getElementById("par2");
  const par3 = document.getElementById("par3");
  const par4 = document.getElementById("par4");

  const num1 = 234;//number integer
  const num2 = 234.56;//number float(double)
  const num3 = 1.23e3;//number float(double)
  const num4 = 0b10101;//number binarna
  const num5 = 0o777;//number ósemkowa
  const num6 = 0x123abAF;//number szesnastkowa
  const num7 = 234 * "2";
  const num8 = 234 + "2";
  const num9 = 234 * "koza";

  par1.innerHTML = `
  <ul>
    <li>num1 = ${num1} jest typu ${typeof(num1)}</li>
    <li>num2 = ${num2} jest typu ${typeof(num2)}</li>
    <li>num3 = ${num3} jest typu ${typeof(num3)}</li>
    <li>num4 = ${num4} jest typu ${typeof(num4)}</li>
    <li>num5 = ${num5} jest typu ${typeof(num5)}</li>
    <li>num6 = ${num6} jest typu ${typeof(num6)}</li>
    <li>num7 = ${num7} jest typu ${typeof(num7)}</li>
    <li>num7 = ${num8} jest typu ${typeof(num8)}</li>
    <li>num7 = ${num9} jest typu ${typeof(num9)}</li>
  </ul>
  `;
</script>
</body>
</html>
