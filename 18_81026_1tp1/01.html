<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Programowanie aplikacji webowych</title>
</head>
<body>
<h3>Programowanie w JavaScript</h3>
<div id="par1"></div>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>

<script>
    const par1 = document.getElementById("par1");
    const par2 = document.getElementById("par2");
    const par3 = document.getElementById("par3");
    const par4 = document.getElementById("par4");

    const numberA = prompt("Wpisz liczbe a", "liczba całkowita");
    const numberB = prompt("Wpisz liczbe b", "liczba całkowita");
    const numberC = prompt("Wpisz liczbe c", "liczba całkowita");

    const a = parseInt(numberA);
    const b = parseInt(numberB);
    const c = parseInt(numberC);

    par1.innerHTML = `a = ${a}<br>b = ${b}<br>c = ${c}`;

    const result2 = (3 * c + 2 * b) / (4 * a - b);

    par2.innerHTML = `Wyrażenie 1: <span style="color: red;">${a + b - 2 * c * b}</span>`;
    par3.innerHTML = `Wyrażenie 2: <span style="color: red;">${result2.toFixed(2)}</span>`;
</script>
</body>
</html>
