<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Programowanie aplikacji webowych</title>
</head>
<body>
<h3>Pętla while</h3>
<div id="par1"></div>
<h3>Pętla for</h3>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>

<script>
    const par1 = document.getElementById("par1");
    const par2 = document.getElementById("par2");
    const par3 = document.getElementById("par3");
    const par4 = document.getElementById("par4");

    let counter1 = 0;
    let result1 = "";
    while(counter1 < 21) {
        result1 += counter1 + " ";
        counter1++;
    }

    par1.innerHTML = result1;

    let result2 = "";
    for(let i = 0; i < 21; i++) {
        result2 += i + " ";
    }

    par2.innerHTML = result2;



</script>
</body>
</html>
