<!doctype html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Programowanie aplikacji webowych</title>
</head>
<body>
<h3>Prompt i typ Number</h3>
<div id="par1"></div>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>

<script>
    const par1 = document.getElementById("par1");
    const par2 = document.getElementById("par2");
    const par3 = document.getElementById("par3");
    const par4 = document.getElementById("par4");

    const strA = prompt("Wpisz liczbę całkowitą A");
    const strB = prompt("Wpisz liczbę całkowitą B");

    const numberA = parseInt(strA);
    const numberB = parseInt(strB);

    const numberFloatA = parseFloat(strA);
    const numberFloatB = parseFloat(strB);

    const result = (numberA**2+numberB)/(numberA-numberB);

    par1.innerHTML = `<p>A = ${numberA}, B = ${numberB}</p>`;
    par2.innerHTML = `<p>A = ${numberFloatA}, B = ${numberFloatB}</p>`;
    par3.innerHTML = `<p>strA = ${strA}, strB = ${strB}</p>`;
    par4.innerHTML = `<p>Wynik: <span style="color: cyan;">${result}</span></p>`;
</script>
</body>
</html>
