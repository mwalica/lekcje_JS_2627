<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div id="par1"></div>
<div id="par2"></div>
<script>
    const par1 = document.getElementById("par1");
    const par2 = document.getElementById("par2");

    const question1 = prompt("Wpisz kolor w języku angielskim");
    const question2 = prompt("Wpisz liczbę A");

    const numA = parseFloat(question2);
    const result = 3 * numA ** 3;

    par1.innerHTML = `Wpisany kolor to: <span style="color: ${question1}">${question1}</span>`;
    par2.innerHTML = `3a<sup>3</sup> = <strong>${result.toFixed(2)}</strong>`;
</script>
</body>
</html>
