<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programowanie aplikacji webowych</title>
</head>
<body>
<h3>Programowanie w JavaScript</h3>
<div id="par1"></div>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>

<script>
  const par1 = document.getElementById("par1");
  const par2 = document.getElementById("par2");
  const par3 = document.getElementById("par3");
  const par4 = document.getElementById("par4");

  const strNum = prompt("Wpisz liczbe całkowitą");
  const num = parseInt(strNum);

  //isNaN() => zwraca true jak cos jest NaN
  //!isNaN() => zwraca true jak coś jest liczbą

  if(!isNaN(num)) {
    if(num % 2 === 0) {
      par1.innerHTML = `Wylosowana liczba <b>${num}</b> jest parzysta`
    } else {
      par1.innerHTML = `Wylosowana liczba <b>${num}</b> jest nieparzysta`;
    }
  } else {
    par1.innerHTML = "Proszę wprowadzić liczbę całkowita";
  }
</script>
</body>
</html>
