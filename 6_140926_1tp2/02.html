<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>metoda getElementById()</title>
</head>
<body>
<h3 id="title">Metoda getElementById()</h3>
<p id="par1"></p>
<p id="par2"></p>
<p id="par3"></p>
<p id="par4">To jest tekst, 4 akapitu</p>
<script>
//tworzenie referencji do elementu html
const title = document.getElementById("title");
const par1 = document.getElementById("par1");
const par2 = document.getElementById("par2");
const par3 = document.getElementById("par3");
const par4 = document.getElementById("par4");

title.innerText = "To jest tytuł zmienniony przez JS :)";

const str1 = "To będzie tekst 1 akapitu";
par1.innerText = str1;
par2.innerHTML = "To jest <b>tekst</b> z elementami HTML";
par3.innerHTML = par4.innerHTML;
par4.innerHTML = "===========";

</script>
</body>
</html>
