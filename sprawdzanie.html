<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartkówka</title>
</head>
<body>

<div id="par1"></div>
<div id="par2"></div>
<div id="par3"></div>
<div id="par4"></div>

<h3>Prompt(), konkatenacja</h3>
<script>

    const par1 = document.getElementById("par1")
    const par2 = document.getElementById("par2")
    const par3 = document.getElementById("par3")
    const par4 = document.getElementById("par4")

    const color = prompt("Wpisz kolor w języku angielskim")
    const numA = prompt("Wpisz liczbę A")

    const a = parseFloat("numA")

    const result1 = (3 * numA ** 3)

    par1.innerHTML = `
        Wpisany kolor to: <span style="color: ${color}">${color}</span>
        `

    par2.innerHTML  = `
        3a<sup>3</sup> = <strong>${result1 .toFixed(2)}</strong>
        `



</script>

</body>
</html>
